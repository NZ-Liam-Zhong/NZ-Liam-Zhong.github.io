pages:
# Links starting with "/#" point to sections of the homepage.
# `name` must match the `navbar_title` in a page's front matter for that page to be highlighted.
# Items with `requires: publications` only appear once there is at least one entry in _publications/.
- name: About
  url: /#about
- name: Experience
  url: /#experience
- name: Honors
  url: /#honors
- name: News
  url: /#news
- name: Publications
  url: /publications
  requires: publications
